name: Add Empty Commit via PR for External Contributor

on:
  push:
    branches:
      - main

jobs:
  create-pr-and-merge:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if external contributor
        id: check
        run: |
          if [[ "${{ github.actor }}" == "${{ github.repository_owner }}" ]] || \
             [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "external=false" >> $GITHUB_OUTPUT
          else
            echo "external=true" >> $GITHUB_OUTPUT
          fi

      - name: Stop if not external
        if: steps.check.outputs.external != 'true'
        run: echo "Not an external contributor. Exiting."

      - name: Create branch with empty commit
        if: steps.check.outputs.external == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/empty-commit-${{ github.run_id }}"
          git checkout -b "$BRANCH"

          git commit --allow-empty -m "chore: empty commit to enable deployment for external contributor"
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        id: branch

      - name: Create PR into main
        if: steps.check.outputs.external == 'true'
        id: pr
        uses: actions/github-script@v6
        with:
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: "${{ steps.branch.outputs.branch }}",
              base: "main",
              title: "chore: enable deployment for external contributor",
              body: "Automated PR created by GitHub Actions to enable deployment."
            });

            core.setOutput("pr_number", pr.number);

      - name: Merge PR
        if: steps.check.outputs.external == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number("${{ steps.pr.outputs.pr_number }}"),
              merge_method: "merge"
            });