name: Add Empty Commit if External Contributor

on:
  push:
    branches:
      - main
      - dev

jobs:
  check-and-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add empty commit if external contributor
        uses: actions/github-script@v6
        with:
          script: |
            const actor = context.actor;
            const owner = context.repo.owner;

            // Skip owner and bot to avoid loops
            if (actor === owner || actor === 'github-actions[bot]') {
              console.log('No action needed: owner or bot push.');
              return;
            }

            console.log('External contributor detected. Adding empty commit.');

            await exec.exec('git config --global user.name "github-actions[bot]"');
            await exec.exec('git config --global user.email "github-actions[bot]@users.noreply.github.com"');

            await exec.exec(
              'git commit --allow-empty -m "chore: empty commit to enable deployment for external contributor"'
            );

            await exec.exec('git push');
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
